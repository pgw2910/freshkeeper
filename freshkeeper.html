<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshKeeper - 냉장고 지킴이</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --danger-color: #ff4d4d;
            --warning-color: #ff9800;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            color: #333;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        /* 입력 폼 스타일 */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"], input[type="date"] {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
        }

        input[type="text"] { flex: 2; }
        input[type="date"] { flex: 1.5; }

        button#add-btn {
            flex: 1;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button#add-btn:hover { background-color: #43a047; }

        /* 리스트 스타일 */
        ul { list-style: none; padding: 0; margin: 0; }

        li {
            background: #fff;
            border-bottom: 1px solid #eee;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        li:last-child { border-bottom: none; }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .item-name { font-weight: bold; font-size: 1.1rem; }
        .item-date { font-size: 0.85rem; color: #666; }

        .d-day-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            color: white;
            min-width: 60px;
            text-align: center;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            margin-left: 10px;
            font-size: 1.2rem;
        }
        .btn-delete:hover { color: var(--danger-color); }

        /* 상태별 색상 */
        .status-safe { background-color: var(--primary-color); }
        .status-warning { background-color: var(--warning-color); } /* 3일 이하 */
        .status-expired { background-color: var(--danger-color); }

        .empty-msg {
            text-align: center;
            color: #aaa;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>🥦 FreshKeeper</h1>
        
        <div class="input-group">
            <input type="text" id="itemName" placeholder="식재료 이름 (예: 우유)">
            <input type="date" id="expiryDate">
            <button id="add-btn">등록</button>
        </div>

        <ul id="foodList">
            </ul>
        <div id="emptyMsg" class="empty-msg">냉장고가 비어있나요?<br>식재료를 등록해보세요!</div>
    </div>

    <script>
        const itemNameInput = document.getElementById('itemName');
        const expiryDateInput = document.getElementById('expiryDate');
        const addBtn = document.getElementById('add-btn');
        const foodList = document.getElementById('foodList');
        const emptyMsg = document.getElementById('emptyMsg');

        // 로컬 스토리지에서 데이터 불러오기
        let foods = JSON.parse(localStorage.getItem('freshKeeperData')) || [];

        // 초기 렌더링
        renderFoods();

        // 등록 버튼 클릭 이벤트
        addBtn.addEventListener('click', () => {
            const name = itemNameInput.value.trim();
            const date = expiryDateInput.value;

            if (!name || !date) {
                alert('이름과 날짜를 모두 입력해주세요!');
                return;
            }

            const newFood = {
                id: Date.now(),
                name: name,
                date: date
            };

            foods.push(newFood);
            saveAndRender();
            
            // 입력창 초기화
            itemNameInput.value = '';
            expiryDateInput.value = '';
            itemNameInput.focus();
        });

        // 삭제 기능
        function deleteFood(id) {
            foods = foods.filter(food => food.id !== id);
            saveAndRender();
        }

        // 데이터 저장 및 화면 갱신
        function saveAndRender() {
            localStorage.setItem('freshKeeperData', JSON.stringify(foods));
            renderFoods();
        }

        // D-Day 계산 함수
        function getDday(dateString) {
            const today = new Date();
            today.setHours(0,0,0,0); // 시간 초기화
            const target = new Date(dateString);
            target.setHours(0,0,0,0);

            const diffTime = target - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            return diffDays;
        }

        // 화면 그리기
        function renderFoods() {
            foodList.innerHTML = '';
            
            if (foods.length === 0) {
                emptyMsg.style.display = 'block';
                return;
            } else {
                emptyMsg.style.display = 'none';
            }

            // 날짜순 정렬 (임박한 순서)
            foods.sort((a, b) => new Date(a.date) - new Date(b.date));

            foods.forEach(food => {
                const li = document.createElement('li');
                const dDay = getDday(food.date);
                
                let badgeClass = 'status-safe';
                let badgeText = `D-${dDay}`;

                if (dDay < 0) {
                    badgeClass = 'status-expired';
                    badgeText = `만료 (${Math.abs(dDay)}일 지남)`;
                } else if (dDay === 0) {
                    badgeClass = 'status-warning';
                    badgeText = '오늘 마감';
                } else if (dDay <= 3) {
                    badgeClass = 'status-warning';
                }

                li.innerHTML = `
                    <div class="item-info">
                        <span class="item-name">${food.name}</span>
                        <span class="item-date">유통기한: ${food.date}</span>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <span class="d-day-badge ${badgeClass}">${badgeText}</span>
                        <button class="btn-delete" onclick="deleteFood(${food.id})">&times;</button>
                    </div>
                `;
                foodList.appendChild(li);
            });
        }
    </script>
</body>
</html>
